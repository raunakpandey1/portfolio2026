<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Loading… | Raunak Kumar Pandey</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) { }
      if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark-theme');
      }
    })();
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" type="text/css" href="/styles/styles.css?v=2026-10-02">
  <link rel="stylesheet" type="text/css" href="/styles/blog.css?v=2026-10-02">
</head>

<body>
  <div class="blog-nav">
    <a href="/blog.html" class="blog-nav-back">← Writing</a>
  </div>

  <article class="blog-post" id="blogPost">
    <p class="blog-loading">Loading…</p>
  </article>

  <footer class="blog-footer">
    <a href="/blog.html">← All writing</a>
  </footer>

  <script src="/blog/marked.min.js"></script>
  <script src="/blog/blog.js?v=2026-10-02"></script>
  <script>
    (function () {
      var container = document.getElementById('blogPost');
      var slug = new URLSearchParams(window.location.search).get('slug');

      function notFound() {
        document.title = 'Not found | Raunak Kumar Pandey';
        container.innerHTML = '<p class="blog-empty">That post doesn’t exist. ' +
          '<a href="/blog.html">Back to all writing.</a></p>';
      }

      if (!slug || !/^[\w-]+$/.test(slug)) {
        notFound();
        return;
      }

      fetch('/blog/posts/' + slug + '.md', { cache: 'no-cache' })
        .then(function (r) {
          if (!r.ok) throw new Error(String(r.status));
          return r.text();
        })
        .then(function (md) {
          var parsed = Blog.parseFrontmatter(md);
          var meta = parsed.meta;
          var title = meta.title || slug;

          document.title = title + ' | Raunak Kumar Pandey';

          // Sets --theme-accent for the whole post from its `theme` frontmatter.
          // Every accent on the page follows from this one line.
          container.setAttribute('data-topic', Blog.topicOf(meta));

          container.innerHTML = Blog.renderPost(meta, parsed.body, slug);

          Blog.attachBehaviors(container);
        })
        .catch(function (e) {
          console.error('Failed to load post:', e);
          notFound();
        });
    })();
  </script>
  <script src="/scripts/site.js?v=2026-10-02"></script>
</body>

</html>
